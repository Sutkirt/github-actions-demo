name: Sutkirt CI workflow

on:
  push:

jobs:
  build-and-push:    # job name
    runs-on: ubuntu-latest  # GitHub Runner (free)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # clone the code into a ubuntu runner

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4  # to authenticate to docker hub and push the image
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/skillpulse-backend:latest